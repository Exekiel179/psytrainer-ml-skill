name: Complete runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test archive construction
        run: python -m unittest discover -s tests -p test_build_skill.py -v
      - name: Build exact committed Skill
        run: python scripts/build_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-package
          path: dist/psytrainer-ml-skill.zip
          if-no-files-found: error

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: skill-package
      - name: Extract the distributable into a fresh directory
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('psytrainer-ml-skill.zip') as archive:
              assert archive.testzip() is None
              assert archive.comment.decode() == os.environ['EXPECTED_COMMIT']
              archive.extractall('fresh')
          root = Path('fresh/psytrainer-ml')
          assert (root / 'SKILL.md').is_file()
          assert not (root / '.venv').exists()
          assert not (root / 'runtime.json').exists()
          assert not list(root.rglob('*.whl'))
      - name: macOS OpenMP
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Configure and test the packaged Skill
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path('fresh/psytrainer-ml').resolve()
          env = dict(os.environ, PYTHONNOUSERSITE='1')
          subprocess.run([sys.executable, 'scripts/install_runtime.py', '--python', sys.executable],
                         cwd=root, env=env, check=True)
          runtime = json.loads((root / 'runtime.json').read_text(encoding='utf-8'))
          assert runtime['ready'] and all(runtime['imports'].values())
          assert not runtime['capabilities']['legacy']
          subprocess.run([runtime['python'], '-c', 'import importlib.util; assert importlib.util.find_spec("ccpl_training_models") is None'],
                         cwd=root, env=env, check=True)
          subprocess.run([runtime['python'], '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
                         cwd=root, env=env, check=True)
          subprocess.run([runtime['python'], 'tests/smoke_pipeline.py'], cwd=root, env=env, check=True)

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skill-package
      - name: Publish the verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Use a stable vMAJOR.MINOR.PATCH tag'
          subprocess.run(['gh', 'release', 'create', tag, 'psytrainer-ml-skill.zip',
                          '--verify-tag', '--draft', '--title', tag, '--generate-notes'], check=True)
          subprocess.run(['gh', 'release', 'download', tag, '--pattern', 'psytrainer-ml-skill.zip',
                          '--dir', 'downloaded'], check=True)
          assert Path('psytrainer-ml-skill.zip').read_bytes() == Path('downloaded/psytrainer-ml-skill.zip').read_bytes()
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest'], check=True)
