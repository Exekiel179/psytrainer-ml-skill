name: Complete runtime

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Skill version to test
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: macOS OpenMP
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install complete runtime
        run: python scripts/install_runtime.py
      - name: Test real runtime
        shell: python
        run: |
          import json, subprocess
          runtime = json.load(open('runtime.json'))
          assert runtime['ready']
          subprocess.run([runtime['python'], '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)
          subprocess.run([runtime['python'], 'tests/smoke_runtime.py'], check=True)
          subprocess.run([runtime['python'], 'tests/smoke_agent.py'], check=True)
          subprocess.run([runtime['python'], 'tests/smoke_pipeline.py'], check=True)

  released-skill:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: macOS OpenMP
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Download published Skill
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: python
        run: |
          import os, subprocess, zipfile
          subprocess.run(['gh', 'release', 'download', os.environ['RELEASE_TAG'],
                          '--pattern', 'psytrainer-ml-skill.zip'], check=True)
          with zipfile.ZipFile('psytrainer-ml-skill.zip') as archive:
              assert archive.testzip() is None
              archive.extractall('fresh')
      - name: Install and test published Skill in a fresh environment
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path('fresh/psytrainer-ml').resolve()
          assert not (root / '.venv').exists()
          assert not (root / 'runtime.json').exists()
          assert (root / 'SKILL.md').is_file()
          assert (root / 'vendor/PsyTrainer-0.2.0-cp314-none-any.whl').is_file()
          env = dict(os.environ, PYTHONNOUSERSITE='1')
          if os.name == 'nt':
              command = ['cmd', '/c', 'scripts\\install_runtime.cmd']
          else:
              command = [sys.executable, 'scripts/install_runtime.py']
          subprocess.run(command, cwd=root, env=env, check=True)
          runtime = json.loads((root / 'runtime.json').read_text())
          assert runtime['ready'] and all(runtime['imports'].values())
          subprocess.run([runtime['python'], '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
                         cwd=root, env=env, check=True)
          subprocess.run([runtime['python'], 'tests/smoke_runtime.py'], cwd=root, env=env, check=True)
          if (root / 'tests/smoke_agent.py').exists():
              subprocess.run([runtime['python'], 'tests/smoke_agent.py'], cwd=root, env=env, check=True)
          if (root / 'tests/smoke_pipeline.py').exists():
              subprocess.run([runtime['python'], 'tests/smoke_pipeline.py'], cwd=root, env=env, check=True)
